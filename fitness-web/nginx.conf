server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    server_tokens off;

    # ------------------------------------------------------------
    # 单页应用：history 模式下所有前端路由回退到 index.html
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------
    # 业务后端：/api/xxx  →  gym-backend:9090/xxx （剥掉 /api 前缀）
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass         http://gym-backend:9090/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        # 会员 Excel 导入导出可能较大
        client_max_body_size  20m;
    }

    # ------------------------------------------------------------
    # 智能体接口：/agent-api/xxx  →  fitness-agent:9091/api/xxx
    # 注意：前缀刻意不用 /agent/，否则会与前端 SPA 路由 /agent 冲突
    #       （nginx 对 "/agent" 会 301 到 "/agent/"，正好被代理规则吃掉）
    # 智能体自身要连大模型，读超时给足
    # ------------------------------------------------------------
    location /agent-api/ {
        proxy_pass         http://fitness-agent:9091/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    90s;
    }

    # ------------------------------------------------------------
    # 静态资源缓存
    # index.html 必须每次校验，否则发版后用户拿到旧壳子
    # ------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ^~ /assets/vendor/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 源码级 js/css：短缓存 + 强制校验，改完即生效（不依赖文件名哈希）
    # vendor 目录因 ^~ 前缀匹配优先，仍享受上面的长缓存
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 图片 / 字体
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
}
